name: Issue 1342 validation
on:
  push:
    branches: [validation/1342-f73b]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: documentation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'
      - run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Regression against original component
        run: |
          cp src/components/CodeSnippet/TabbedCodeSnippet.tsx /tmp/fixed.tsx
          git show 8e0b523a99ce0421af68299d1d7f4659f74ba739:documentation/src/components/CodeSnippet/TabbedCodeSnippet.tsx > src/components/CodeSnippet/TabbedCodeSnippet.tsx
          set +e
          npm run test -- src/components/CodeSnippet/TabbedCodeSnippet.test.tsx > baseline.log 2>&1
          result=$?
          cp /tmp/fixed.tsx src/components/CodeSnippet/TabbedCodeSnippet.tsx
          cat baseline.log
          test "$result" -ne 0
      - name: Focused tests
        run: npm run test -- src/components/CodeSnippet > tests.log 2>&1
      - name: Scoped lint and format
        run: |
          npx --no-install eslint src/components/CodeSnippet/TabbedCodeSnippet.tsx src/components/CodeSnippet/TabbedCodeSnippet.test.tsx
          npx --no-install prettier --check src/components/CodeSnippet/TabbedCodeSnippet.tsx src/components/CodeSnippet/TabbedCodeSnippet.test.tsx
      - name: Required documentation checks
        if: always()
        run: |
          set +e
          failed=0
          for check in typecheck lint format:check check:content-registry build; do
            npm run "$check" > "check-${check//:/-}.log" 2>&1
            result=$?
            echo "$check exit=$result" | tee -a checks-summary.log
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - name: Compatible lint diagnostics
        if: always()
        run: |
          npm install --prefix /tmp/lint-tool --ignore-scripts --no-package-lock --no-audit --no-fund eslint@9.39.5
          node /tmp/lint-tool/node_modules/eslint/bin/eslint.js src/components/CodeSnippet/TabbedCodeSnippet.tsx src/components/CodeSnippet/TabbedCodeSnippet.test.tsx > lint-compatible.log 2>&1
      - name: Baseline build comparison
        if: always()
        run: |
          cp src/components/CodeSnippet/TabbedCodeSnippet.tsx /tmp/fixed.tsx
          git show 8e0b523a99ce0421af68299d1d7f4659f74ba739:documentation/src/components/CodeSnippet/TabbedCodeSnippet.tsx > src/components/CodeSnippet/TabbedCodeSnippet.tsx
          set +e
          npm run build > baseline-build.log 2>&1
          result=$?
          cp /tmp/fixed.tsx src/components/CodeSnippet/TabbedCodeSnippet.tsx
          echo "Baseline build exit=$result"
          npx --no-install prettier --check src/components/CodeSnippet/TabbedCodeSnippet.tsx src/components/CodeSnippet/TabbedCodeSnippet.test.tsx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1342-results
          path: documentation/*.log
