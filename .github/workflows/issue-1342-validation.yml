name: Issue 1342 validation
on:
  push:
    branches: [validation/1342-f73b]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: documentation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.0'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Regression against original component
        run: |
          cp src/components/CodeSnippet/TabbedCodeSnippet.tsx /tmp/fixed.tsx
          git show HEAD~1~1:documentation/src/components/CodeSnippet/TabbedCodeSnippet.tsx > src/components/CodeSnippet/TabbedCodeSnippet.tsx
          set +e
          bun run test src/components/CodeSnippet/TabbedCodeSnippet.test.tsx > baseline.log 2>&1
          result=$?
          cp /tmp/fixed.tsx src/components/CodeSnippet/TabbedCodeSnippet.tsx
          cat baseline.log
          test "$result" -ne 0
      - name: Focused tests
        run: bun run test src/components/CodeSnippet > tests.log 2>&1
      - name: Scoped lint and format
        run: |
          bunx eslint src/components/CodeSnippet/TabbedCodeSnippet.tsx src/components/CodeSnippet/TabbedCodeSnippet.test.tsx
          bunx prettier --check src/components/CodeSnippet/TabbedCodeSnippet.tsx src/components/CodeSnippet/TabbedCodeSnippet.test.tsx
      - name: Required documentation checks
        if: always()
        run: |
          set +e
          failed=0
          for check in typecheck lint format:check check:content-registry build; do
            bun run "$check" > "check-${check//:/-}.log" 2>&1
            result=$?
            echo "$check exit=$result" | tee -a checks-summary.log
            if [ "$result" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-1342-results
          path: documentation/*.log
